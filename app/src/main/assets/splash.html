<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .stitch-outline {
      stroke: #ffffff;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .capsule-1 {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: drawCapsule 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .capsule-2 {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: drawCapsule 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.2s;
    }
    .stitch-cut {
      stroke: #000000;
      stroke-width: 7.5;
      stroke-linecap: round;
      stroke-dasharray: 55;
      stroke-dashoffset: 55;
      animation: drawStitch 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.5s;
    }
    .logo-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      font-size: 96px;
      font-weight: 600;
      letter-spacing: -2.5px;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawText 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.4s;
    }
    @keyframes drawCapsule {
      0% { stroke-dashoffset: 520; fill: transparent; }
      35% { stroke-dashoffset: 0; fill: transparent; }
      55%, 85% { stroke-dashoffset: 0; fill: #ffffff; }
      100% { stroke-dashoffset: 0; fill: transparent; }
    }
    @keyframes drawStitch {
      0%, 20% { stroke-dashoffset: 55; }
      40%, 85% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawText {
      0% { stroke-dashoffset: 600; fill: transparent; }
      40% { stroke-dashoffset: 0; fill: transparent; }
      60%, 85% { stroke-dashoffset: 0; fill: #ffffff; }
      100% { stroke-dashoffset: 0; fill: transparent; }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background: #000000;">
    <g id="icon-mark" transform="translate(180, 180) rotate(45)">
      <rect class="stitch-outline capsule-1" x="-72" y="-95" width="66" height="150" rx="33" />
      <rect class="stitch-outline capsule-2" x="6" y="-55" width="66" height="150" rx="33" />
      <line class="stitch-cut" x1="-20" y1="0" x2="20" y2="0" />
    </g>
    <g id="brand-text">
      <text x="320" y="212" class="stitch-outline logo-text">CodeStitcher</text>
    </g>
  </svg>
</body>
</html>
